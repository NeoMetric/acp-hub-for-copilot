name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run generate:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run package
      - name: Prove the VSIX ships no server code
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $vsix = Get-ChildItem -Path . -Filter *.vsix | Sort-Object LastWriteTime | Select-Object -Last 1
          if (-not $vsix) { throw 'npm run package produced no VSIX.' }
          $zip = [System.IO.Compression.ZipFile]::OpenRead($vsix.FullName)
          try {
            $paths = $zip.Entries | ForEach-Object { $_.FullName }
          } finally {
            $zip.Dispose()
          }
          $paths | Sort-Object | ForEach-Object { Write-Host $_ }
          $leaked = @($paths | Where-Object { $_ -match 'server-dist' -or $_ -match 'hosts[\\/]http' })
          if ($leaked.Count -gt 0) {
            $leaked | ForEach-Object { Write-Host "::error::$($vsix.Name) ships server code: $_" }
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: acp-hub-vsix
          path: '*.vsix'
